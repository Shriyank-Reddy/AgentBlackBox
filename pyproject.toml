[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentblackbox"
version = "0.1.0"
description = "Tamper-evident flight recorder and policy firewall for AI agents (all tools are mocks; no network)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Shriyank Reddy Singireddy" }]
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5"]

[project.scripts]
abb = "agentblackbox.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=agentblackbox --cov-report=term-missing:skip-covered"

[tool.coverage.report]
fail_under = 85

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"scenarios/**" = ["E501"]  # scenario payloads are data; long strings are clearer unbroken
"tests/**" = ["E501"]
"src/agentblackbox/viewer.py" = ["E501"]  # embedded HTML/CSS/JS template
